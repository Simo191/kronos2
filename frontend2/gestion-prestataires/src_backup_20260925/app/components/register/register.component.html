<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100 py-5">
    <div class="col-md-6">
      <div class="card shadow-lg">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill" style="font-size: 4rem; color: #6c757d;"></i>
            <h2 class="mt-3 fw-bold">Créer un compte</h2>
            <p class="text-muted">Rejoignez-nous dès aujourd'hui</p>
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">Prénom</label>
                <input
                  type="text"
                  class="form-control"
                  id="firstName"
                  [(ngModel)]="firstName"
                  name="firstName"
                  required
                  [disabled]="isLoading"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">Nom</label>
                <input
                  type="text"
                  class="form-control"
                  id="lastName"
                  [(ngModel)]="lastName"
                  name="lastName"
                  required
                  [disabled]="isLoading"
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  [(ngModel)]="email"
                  name="email"
                  placeholder="votre@email.com"
                  required
                  [disabled]="isLoading"
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  [(ngModel)]="password"
                  name="password"
                  placeholder="••••••••"
                  required
                  [disabled]="isLoading"
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input
                  type="password"
                  class="form-control"
                  id="confirmPassword"
                  [(ngModel)]="confirmPassword"
                  name="confirmPassword"
                  placeholder="••••••••"
                  required
                  [disabled]="isLoading"
                />
              </div>
            </div>

            @if (errorMessage) {
              <div class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{ errorMessage }}
              </div>
            }

            @if (successMessage) {
              <div class="alert alert-success" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                {{ successMessage }}
              </div>
            }

            <button type="submit" class="btn btn-success w-100 mb-3" [disabled]="isLoading">
              @if (isLoading) {
                <span class="spinner-border spinner-border-sm me-2"></span>
                Création en cours...
              } @else {
                <i class="bi bi-person-check me-2"></i>
                Créer mon compte
              }
            </button>

            <div class="text-center">
              <p class="mb-0">
                Vous avez déjà un compte ?
                <a routerLink="/login" class="text-decoration-none">Se connecter</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
